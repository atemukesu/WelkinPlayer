name: Test Linux

# Fast compile/bundle smoke test. Triggered manually (Actions -> CI -> Run
# workflow) without publishing a tag.
#
# Unlike `release.yml` this does NOT sign bundles or upload a GitHub Release;
# it only proves the Linux desktop build + deb/rpm bundling and the Arch
# (.pkg.tar.zst) repackaging succeed. Use
# it for fast iteration on CI failures (e.g. missing system libraries) instead
# of pushing throwaway tags. No automatic push/PR triggers, so it never burns
# runner minutes on its own.
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # GTK 4 + Chromium (CEF) runtime/build deps. libayatana-appindicator3-dev
          # provides the .pc file that `pkg-config` needs so the Tauri bundler's
          # tray detection does not panic with "Can't detect any appindicator
          # library"; librsvg2-dev is required by the AppImage bundler script.
          sudo apt-get install -y \
            libgtk-4-dev libx11-dev libxkbcommon-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxcomposite-dev libxfixes-dev \
            libnss3-dev libasound2-dev libpulse-dev libcups2-dev \
            libatk1.0-dev libatk-bridge2.0-dev libdrm-dev libgbm-dev \
            libwayland-dev patchelf \
            libayatana-appindicator3-dev librsvg2-dev \
            libfuse2

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri-cef
          key: cef-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Linux builds on the CEF runtime, so the bundler must be the CEF-aware
      # CLI (copies libcef.so / resources / locales). See release.yml for why
      # this must be >= 3.0.0-alpha.27: older cli-cef builds only detect a `cef`
      # cargo feature, not the `tauri-runtime-cef` dependency used here.
      - name: Use CEF-aware CLI on Linux
        run: |
          cli_prefix="$RUNNER_TEMP/tauri-cli-cef"
          npm install --prefix "$cli_prefix" --no-save --no-package-lock \
            @tauri-apps/cli-cef@3.0.0-alpha.27
          rm -f node_modules/.bin/tauri
          ln -s "$cli_prefix/node_modules/@tauri-apps/cli-cef/tauri.js" \
            node_modules/.bin/tauri
          pnpm tauri --version

      - name: Sync version from package.json
        run: pnpm version:sync

      - name: Build desktop bundle (smoke test)
        # Linux ships deb/rpm only; skip the brittle AppImage (linuxdeploy) path.
        # The updater artifacts still need signing, so pass the private key like
        # the release job does (the repo secret is readable on manual dispatch).
        # `build.beforeBundleCommand` runs scripts/patch-cef-angle-stubs.mjs here
        # to satisfy the bundler's stale ANGLE file list (tauri-apps/tauri#16338).
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --bundles deb,rpm

      # Catches the silent-regression mode where the CEF runtime is not detected
      # and the bundle turns into a ~12 MB package with no `libcef.so`.
      - name: Verify CEF runtime is bundled
        run: node scripts/verify-cef-bundle.mjs --bundle src-tauri/target/release/bundle

      # Tauri has no pacman bundler, so the Arch package is the already verified
      # .deb repackaged by makepkg. The official Arch container supplies
      # makepkg/fakeroot/bsdtar; package-arch.sh runs it as an unprivileged user
      # (makepkg refuses uid 0) and re-checks that libcef.so is inside the
      # resulting .pkg.tar.zst. This mirrors the smoke test above without
      # publishing anything.
      - name: Build Arch package (.pkg.tar.zst)
        run: |
          mkdir -p dist/arch
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/dist/arch:/out" \
            archlinux:base-devel \
            bash /src/scripts/package-arch.sh \
              --deb-dir /src/src-tauri/target/release/bundle/deb \
              --out /out
