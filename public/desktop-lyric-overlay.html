<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welkin Desktop Lyrics</title>
    <style>
      :root {
        --pad-x: 28px;
        --pad-y: 18px;
        --opacity: 1;
        --font-size: 38px;
        --translation-size: 17px;
        --font-weight: 700;
        --text-color: #f5f5f5;
        --active-color: #f0a500;
        --translation-color: #b9bec8;
        --stroke-width: 0px;
        --stroke-scale: 0;
        --stroke-color: transparent;
        --align: left;
        --stage-top: 0px;
        --surface: rgba(19, 21, 25, 0.78);
        --line: rgba(255, 255, 255, 0.18);
        --line-strong: rgba(255, 255, 255, 0.34);
        --dim: rgba(255, 255, 255, 0.58);
        --ui-accent: #f0a500;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color-scheme: dark;
      }

      body {
        color: var(--text-color);
        font-family: "Noto Sans SC Variable", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        /* A transparent window already loses subpixel AA; forcing `antialiased`
           (thin grayscale) and `optimizeLegibility` (extra kerning passes) just
           makes large glyphs look more jagged. Leave both on `auto`. */
        -webkit-font-smoothing: auto;
        -moz-osx-font-smoothing: auto;
        text-rendering: auto;
      }

      body.is-hidden #stage {
        opacity: 0;
        visibility: hidden;
      }

      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: var(--pad-y) var(--pad-x);
        overflow: hidden;
        text-align: var(--align);
        opacity: var(--opacity);
        cursor: grab;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 180ms ease, background-color 180ms ease;
      }

      /* Desktop: pin the content below a fixed offset so growing the window for
         extra lines never moves the lead line. */
      body.desktop #stage {
        align-items: start;
        padding-top: var(--stage-top, var(--pad-y));
      }

      /* Android hosts the renderer in a WRAP_CONTENT overlay WebView. There the
         absolute, height:100% layout has no intrinsic height, so the window
         collapses to zero and nothing is painted. Let the content flow. */
      html.android,
      html.android body {
        height: auto;
        min-height: 0;
      }

      html.android #stage {
        position: relative;
        inset: auto;
        display: block;
        padding: var(--pad-y) var(--pad-x);
      }

      html.android #current {
        max-height: none;
      }

      #stage:active { cursor: grabbing; }

      html:not(.android)       /* Only a real mouse gets the sticky `:hover` surface. Touch is driven by
         the renderer's `.touching` class, so a hybrid laptop never leaves the
         hover background latched after a finger tap. */
      body.mouse:not(.locked):hover #stage,
      body:not(.locked).resizing #stage,
      body:not(.locked).dragging #stage { background: rgba(0, 0, 0, 0.42); }

      /* Touch feedback is driven by the renderer instead of relying on the
         browser's inconsistent mobile :hover implementation. */
      body.touching #stage { background: rgba(0, 0, 0, 0.42) !important; }

      #current {
        display: grid;
        width: 100%;
        min-width: 0;
        max-height: 100%;
        overflow: hidden;
      }

      .lyric-block {
        grid-area: 1 / 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-auto-rows: min-content;
        align-content: start;
        gap: 7px;
        width: 100%;
        min-width: 0;
        transition: opacity 560ms ease, filter 560ms ease;
      }

      .lyric-block.is-leaving {
        opacity: 0;
        filter: blur(10px);
      }

      .primary-group {
        grid-area: 1 / 1;
        align-self: start;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        justify-items: var(--align);
        gap: 7px;
        width: 100%;
        min-width: 0;
        transition: opacity 560ms ease, filter 560ms ease;
        /* No permanent `will-change`: it promoted the layer to its own
           offscreen texture around the clock, so the text was rasterised at a
           mismatched scale and lost subpixel positioning. Promote only while
           the enter animation actually runs. */
      }

      .primary-group.is-leaving {
        opacity: 0;
        filter: blur(10px);
      }

      .primary-group.is-entering {
        will-change: opacity, filter;
        /* `backwards` (not `both`) so `filter` returns to `none` once done and
           the offscreen texture is dropped. */
        animation: lyric-enter 640ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }

      @keyframes lyric-enter {
        from { opacity: 0; filter: blur(10px); }
        to { opacity: 1; filter: blur(0); }
      }

      /* Multi-line blocks (lead + duet + background appearing together) use a
         smooth opacity fade instead of the blur, which reads as a jarring
         full-screen wipe when only part of the block changed. */
      .primary-group.is-leaving-soft {
        opacity: 0;
      }

      .primary-group.is-entering-soft {
        will-change: opacity;
        animation: lyric-enter-soft 480ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }

      @keyframes lyric-enter-soft {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .extra-group {
        grid-area: 2 / 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        justify-items: var(--align);
        gap: 7px;
        width: 100%;
        min-width: 0;
      }

      .extra-group[hidden] { display: none; }

      .extra-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        justify-items: var(--align);
        gap: 7px;
        width: 100%;
        min-width: 0;
        transition: opacity 220ms ease;
      }

      .extra-item.is-entering {
        animation: extra-enter 280ms ease both;
      }

      .extra-item.is-leaving {
        opacity: 0;
      }

      @keyframes extra-enter {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .lyric-line {
        max-width: 100%;
        min-width: 0;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .lyric-line.primary {
        font-size: var(--font-size);
        font-weight: var(--font-weight);
        line-height: 1.2;
        color: var(--active-color);
      }

      .lyric-line.bg {
        font-size: calc(var(--font-size) * 0.75);
        font-weight: 600;
        line-height: 1.2;
        color: var(--dim);
      }

      .translation.bg-translation {
        font-size: calc(var(--translation-size) * 0.75);
      }

      /* Second voice of a duet sits against the right edge. */
      .duet {
        justify-self: end;
        text-align: right;
      }

      .translation,
      .roman {
        max-width: 100%;
        margin: 0;
        font-size: var(--translation-size);
        font-weight: 500;
        line-height: 1.3;
        color: var(--translation-color);
      }

      .roman { opacity: 0.76; }

      /* `inline-block` gives the absolutely positioned karaoke overlay a real
         containing box; anchored to an inline box it would sit on the line-box
         top instead of on the text. */
      .word {
        display: inline-block;
        position: relative;
        white-space: pre-wrap;
      }

      /* Stroke is opt-in through `.has-stroke`. A permanently attached
         `-webkit-text-stroke` (even a 0px one) plus `paint-order` routes the
         glyphs through the stroke path, which drops subpixel positioning and
         grayscale smoothing - hence the jagged edges. Uses the translation's
         recipe: opaque fill + `paint-order: stroke fill` paints the fill over
         the inner half of the centred stroke, leaving only the outer outline. */
      .has-stroke .word {
        -webkit-text-stroke: calc(var(--font-size) * 0.06 * var(--stroke-scale)) var(--stroke-color);
        paint-order: stroke fill;
      }

      .has-stroke .translation,
      .has-stroke .roman {
        -webkit-text-stroke: calc(var(--stroke-width) * 1.5) var(--stroke-color);
        paint-order: stroke fill;
      }

      .primary .word { color: var(--text-color); }

      .bg .word { color: var(--dim); }

      .karaoke .word { --p: 0%; }

      /* Karaoke sweep. It must NOT live on `.word` itself: turning that fill
         transparent is exactly what defeated `paint-order` and produced the
         outlined-with-a-square-in-the-middle artifact. Keeping the played
         portion on a stroke-less overlay leaves the base word with the same
         opaque fill + stroke as the translation line.

         The sweep uses a horizontal clip-path rather than `background-clip:
         text`: the latter only paints the background inside the element box, so
         the descenders of y/g were left un-highlighted. A solid fill clipped by
         an inset (with negative vertical insets) keeps the whole glyph, tail
         included. */
      .karaoke .word::after {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        white-space: pre-wrap;
        color: var(--active-color);
        -webkit-text-stroke-width: 0;
        clip-path: inset(-0.6em calc(100% - var(--p)) -0.6em 0);
        pointer-events: none;
      }

      #tools {
        position: fixed;
        top: 8px;
        left: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 4px;
        border: 0;
        background: transparent;
        box-shadow: none;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-5px);
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 10;
      }

      body:not(.locked).controls-visible #tools,
      body:not(.locked).dragging #tools,
      #tools:focus-within {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      body.locked #tools { display: none; }

      #track {
        display: block;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        padding: 0 4px;
        color: var(--text-color);
        font-size: 13px;
        font-weight: 600;
        text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        opacity: 0.96;
      }

      #tools #track {
        flex: 1 1 auto;
      }

      #tools button:first-of-type {
        margin-left: auto;
      }

      #tools button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--text-color);
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.82));
        cursor: pointer;
        transition: color 120ms ease, opacity 120ms ease, transform 120ms ease;
      }

      #tools button:hover,
      #tools button:focus-visible {
        color: var(--ui-accent);
        opacity: 1;
        transform: scale(1.12);
        background: transparent;
        outline: none;
      }

      body.touching #tools button:hover {
        color: var(--text-color);
        background: transparent;
        transform: none;
      }

      body.touching #tools button:focus-visible {
        color: var(--text-color);
        background: transparent;
        transform: none;
      }

      body.touching #tools:focus-within {
        opacity: 0;
        pointer-events: none;
      }

      #tools svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

      #tools #prev svg,
      #tools #play svg,
      #tools #next svg { fill: currentColor; }

      #resize {
        position: fixed;
        right: 6px;
        bottom: 6px;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid transparent;
         background: transparent;
         color: var(--dim);
         filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.82));
        cursor: nwse-resize;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, color 120ms ease, border-color 120ms ease;
        z-index: 10;
      }

      body.mouse:not(.locked):hover #resize,
      body:not(.locked).controls-visible #resize,
      body:not(.locked).touching #resize,
      body:not(.locked).resizing #resize,
      #resize:focus-visible {
        opacity: 1;
        pointer-events: auto;
      }

      #resize:hover { color: var(--ui-accent); border-color: transparent; }

      body.locked #resize { display: none; }

      /* The Android overlay is sized by the system window (no manual resize
         handle) and has no hover, so the controls are revealed by a tap. */
      html.android #resize { display: none; }

      #resize svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <main id="stage"><div id="current" aria-live="polite"></div></main>
    <nav id="tools" aria-label="Desktop lyric controls">
      <span id="track"></span>
      <button id="prev" type="button" title="上一首" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M18 6 8 12l10 6z"/><path d="M6 6v12"/></svg></button>
      <button id="play" type="button" title="播放/暂停" aria-label="播放/暂停"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg></button>
      <button id="next" type="button" title="下一首" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M6 6l10 6-10 6z"/><path d="M18 6v12"/></svg></button>
      <button id="lock" type="button" title="锁定/解锁" aria-label="锁定/解锁"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
      <button id="close" type="button" title="关闭桌面歌词" aria-label="关闭桌面歌词"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </nav>
    <button id="resize" type="button" title="按住拖动调整大小" aria-label="按住拖动调整大小"><svg viewBox="0 0 24 24"><path d="M20 8 8 20M20 14l-6 6"/></svg></button>
    <script src="/desktop-lyric-overlay.js"></script>
  </body>
</html>
