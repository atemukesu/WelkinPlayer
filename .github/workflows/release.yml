name: Release

# Publishing a tag like `v1.0.0` builds and signs every platform in parallel,
# uploads the bundles as build artifacts, and a final `release` job collects
# them into a single GitHub Release (with the updater manifest `latest.json`).
# Nothing is published until every build has succeeded.
#
# The release notes come from `changelog.md`, which is authored locally by
# `scripts/prepare-release.mjs` (DeepSeek-assisted, maintainer-reviewed) and
# committed with the tag. No AI key is stored in this repository.
#
# Desktop bundles are signed for the Tauri updater (the app downloads and
# installs them itself); the APK is offered as a browser download in-app.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           content of the Tauri signing private key
#   ANDROID_KEYSTORE_BASE64             base64 of the Android release keystore
#   ANDROID_KEYSTORE_PASSWORD           keystore password
#   ANDROID_KEY_ALIAS                   key alias inside the keystore
#   ANDROID_KEY_PASSWORD                key password
#
# The generated Tauri key has no password, so no
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is needed (GitHub rejects empty ones).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  desktop:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            bundle: "src-tauri/target/aarch64-apple-darwin/release/bundle"
            os: macos
            key: darwin-aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            bundle: "src-tauri/target/x86_64-apple-darwin/release/bundle"
            os: macos
            key: darwin-x86_64
          - platform: ubuntu-22.04
            args: ""
            bundle: "src-tauri/target/release/bundle"
            os: linux
            key: linux-x86_64
          - platform: windows-latest
            args: ""
            bundle: "src-tauri/target/release/bundle"
            os: windows
            key: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from package.json
        run: pnpm version:sync

      - name: Build desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Stage bundles
        run: node scripts/stage-bundles.mjs --bundle "${{ matrix.bundle }}" --out "dist/${{ matrix.key }}" --os "${{ matrix.os }}" --key "${{ matrix.key }}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.key }}
          path: dist/${{ matrix.key }}
          if-no-files-found: error

  android:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Use the preinstalled Android SDK
        run: |
          # android-actions/setup-android@v3 tries to install the removed legacy
          # `tools` package and fails on current SDKs. The GitHub runner already
          # ships an SDK, so just accept its licenses and export the paths.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n1)
          if [ -n "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from package.json
        run: pnpm version:sync

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/welkin.keystore"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/welkin.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build signed APKs (per ABI)
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android build --apk --split-per-abi

      - name: Stage APKs
        run: |
          mkdir -p dist/android
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk; do
            abi=$(basename "$apk" | sed -nE 's/^app-(.+)-release\.apk$/\1/p')
            if [ -z "$abi" ] || [ "$abi" = "universal" ]; then
              abi=$(printf '%s' "$apk" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -n1)
            fi
            [ -z "$abi" ] && abi="universal"
            cp "$apk" "dist/android/Welkin-${{ github.ref_name }}-${abi}.apk"
            echo "staged Welkin-${{ github.ref_name }}-${abi}.apk"
          done
          ls -l dist/android

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android
          if-no-files-found: error

  release:
    needs: [desktop, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Resolve release notes
        shell: bash
        run: |
          # changelog.md is authored locally (see scripts/prepare-release.mjs) and
          # committed with the tag. Fall back to a minimal note if it is absent.
          if [ ! -s changelog.md ]; then
            printf 'Welkin ${{ github.ref_name }}\n' > changelog.md
          fi

      - name: Generate updater manifest (latest.json)
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/make-latest-json.mjs \
            --dist dist \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --version "$version" \
            --notes-file changelog.md \
            --out latest.json

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          mapfile -t files < <(find dist -type f)
          files+=(latest.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Welkin $tag" --notes-file changelog.md
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "Welkin $tag" --notes-file changelog.md --verify-tag
          fi
