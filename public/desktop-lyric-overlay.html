<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welkin Desktop Lyrics</title>
    <style>
      :root {
        --pad-x: 28px;
        --pad-y: 18px;
        --opacity: 1;
        --font-size: 38px;
        --translation-size: 17px;
        --font-weight: 700;
        --text-color: #f5f5f5;
        --active-color: #f0a500;
        --translation-color: #b9bec8;
        --stroke-width: 0px;
        --stroke-color: transparent;
        --align: left;
        --stage-top: 0px;
        --surface: rgba(19, 21, 25, 0.78);
        --line: rgba(255, 255, 255, 0.18);
        --line-strong: rgba(255, 255, 255, 0.34);
        --dim: rgba(255, 255, 255, 0.58);
        --ui-accent: #f0a500;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color-scheme: dark;
      }

      body {
        color: var(--text-color);
        font-family: "Noto Sans SC Variable", "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body.is-hidden #stage {
        opacity: 0;
        visibility: hidden;
      }

      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: var(--pad-y) var(--pad-x);
        overflow: hidden;
        text-align: var(--align);
        opacity: var(--opacity);
        cursor: grab;
        transition: opacity 180ms ease, background-color 180ms ease;
      }

      /* Desktop: pin the content below a fixed offset so growing the window for
         extra lines never moves the lead line. */
      body.desktop #stage {
        align-items: start;
        padding-top: var(--stage-top, var(--pad-y));
      }

      /* Android hosts the renderer in a WRAP_CONTENT overlay WebView. There the
         absolute, height:100% layout has no intrinsic height, so the window
         collapses to zero and nothing is painted. Let the content flow. */
      html.android,
      html.android body {
        height: auto;
        min-height: 0;
      }

      html.android #stage {
        position: relative;
        inset: auto;
        display: block;
        padding: var(--pad-y) var(--pad-x);
      }

      html.android #current {
        max-height: none;
      }

      #stage:active { cursor: grabbing; }

      body:not(.locked) #stage:hover,
      body:not(.locked).resizing #stage { background: rgba(0, 0, 0, 0.5); }

      #current {
        display: grid;
        width: 100%;
        max-height: 100%;
        overflow: hidden;
      }

      .lyric-block {
        grid-area: 1 / 1;
        display: grid;
        grid-template-columns: 1fr;
        grid-auto-rows: min-content;
        align-content: start;
        gap: 7px;
        width: 100%;
        transition: opacity 560ms ease, filter 560ms ease;
      }

      .lyric-block.is-leaving {
        opacity: 0;
        filter: blur(10px);
      }

      .primary-group {
        grid-area: 1 / 1;
        align-self: start;
        display: grid;
        justify-items: var(--align);
        gap: 7px;
        width: 100%;
        transition: opacity 560ms ease, filter 560ms ease;
        will-change: opacity, filter;
      }

      .primary-group.is-leaving {
        opacity: 0;
        filter: blur(10px);
      }

      .primary-group.is-entering {
        animation: lyric-enter 640ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes lyric-enter {
        from { opacity: 0; filter: blur(10px); }
        to { opacity: 1; filter: blur(0); }
      }

      .extra-group {
        grid-area: 2 / 1;
        display: grid;
        justify-items: var(--align);
        gap: 7px;
        width: 100%;
      }

      .extra-group[hidden] { display: none; }

      .extra-item {
        display: grid;
        justify-items: var(--align);
        gap: 7px;
        width: 100%;
        transition: opacity 220ms ease;
      }

      .extra-item.is-entering {
        animation: extra-enter 280ms ease both;
      }

      .extra-item.is-leaving {
        opacity: 0;
      }

      @keyframes extra-enter {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .lyric-line {
        max-width: 100%;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .lyric-line.primary {
        font-size: var(--font-size);
        font-weight: var(--font-weight);
        line-height: 1.2;
        color: var(--active-color);
      }

      .lyric-line.bg {
        font-size: calc(var(--font-size) * 0.75);
        font-weight: 600;
        line-height: 1.2;
        color: var(--dim);
      }

      .translation.bg-translation {
        font-size: calc(var(--translation-size) * 0.75);
      }

      /* Second voice of a duet sits against the right edge. */
      .duet {
        justify-self: end;
        text-align: right;
      }

      .translation,
      .roman {
        max-width: 100%;
        margin: 0;
        font-size: var(--translation-size);
        font-weight: 500;
        line-height: 1.3;
        color: var(--translation-color);
        -webkit-text-stroke: calc(var(--stroke-width) * 1.5) var(--stroke-color);
        paint-order: stroke fill;
      }

      .roman { opacity: 0.76; }

      .word {
        white-space: pre-wrap;
        -webkit-text-stroke: var(--stroke-width) var(--stroke-color);
        paint-order: stroke fill;
      }

      .primary .word { color: var(--text-color); }

      .bg .word { color: var(--dim); }

      .karaoke .word {
        --p: 0%;
        --unplayed: var(--text-color);
        color: transparent;
        background-image: linear-gradient(90deg, var(--active-color) 0 var(--p), var(--unplayed) var(--p) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .karaoke .bg .word { --unplayed: var(--dim); }

      #tools {
        position: fixed;
        top: 8px;
        right: 10px;
        display: flex;
        gap: 1px;
        padding: 3px;
        border: 1px solid var(--line);
        border-top: 2px solid var(--ui-accent);
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.26);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-5px);
        transition: opacity 140ms ease, transform 140ms ease;
        z-index: 10;
        clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%);
      }

      body:not(.locked):hover #tools,
      #tools:focus-within {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      body.locked #tools { display: none; }

      #tools button {
        display: grid;
        place-items: center;
        width: 30px;
        height: 28px;
        border: 1px solid transparent;
        color: var(--dim);
        cursor: pointer;
        transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease;
      }

      #tools button:hover,
      #tools button:focus-visible {
        border-color: var(--line-strong);
        background: rgba(255, 255, 255, 0.08);
        color: var(--ui-accent);
      }

      #tools svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      #resize {
        position: fixed;
        right: 6px;
        bottom: 6px;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid transparent;
        background: var(--surface);
        color: var(--dim);
        cursor: nwse-resize;
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease, color 120ms ease, border-color 120ms ease;
        z-index: 10;
      }

      body:not(.locked):hover #resize,
      #resize:focus-visible {
        opacity: 1;
        pointer-events: auto;
      }

      #resize:hover { color: var(--ui-accent); border-color: var(--line-strong); }

      body.locked #resize { display: none; }

      #resize svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <main id="stage"><div id="current" aria-live="polite"></div></main>
    <nav id="tools" aria-label="Desktop lyric controls">
      <button id="drag" type="button" title="拖动" aria-label="拖动"><svg viewBox="0 0 24 24"><path d="M9 5h6M9 12h6M9 19h6"/><path d="M5 5h.01M5 12h.01M5 19h.01M19 5h.01M19 12h.01M19 19h.01"/></svg></button>
      <button id="lock" type="button" title="锁定/解锁" aria-label="锁定/解锁"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
      <button id="close" type="button" title="关闭桌面歌词" aria-label="关闭桌面歌词"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </nav>
    <button id="resize" type="button" title="按住拖动调整大小" aria-label="按住拖动调整大小"><svg viewBox="0 0 24 24"><path d="M20 8 8 20M20 14l-6 6"/></svg></button>
    <script src="/desktop-lyric-overlay.js"></script>
  </body>
</html>
