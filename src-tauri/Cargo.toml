[package]
name = "welkinplayer"
version = "1.0.3-rc"
description = "A Tauri App"
authors = ["Atemukesu"]
license = "GPL-3.0-only"
repository = "https://github.com/atemukesu/WelkinPlayer"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "welkinplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
# The webview runtime is no longer a feature of `tauri`: since Tauri 3 the app
# depends on a runtime crate directly and picks it at startup. Linux uses CEF
# (see the target-specific dependencies below), every other target uses wry.
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-store = "3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# WebDAV client. rustls avoids a system TLS/OpenSSL dependency on every OS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
quick-xml = "0.37"
percent-encoding = "2"
# Bounded concurrency for the recursive PROPFIND library walk.
futures-util = "0.3"
# Zeroes the stored WebDAV password when the client is dropped.
zeroize = "1"
# Audio metadata parsing reads only the file head (HTTP Range), never the whole file.
lofty = "0.22"
# Decode embedded cover art and re-encode a small JPEG thumbnail for the cache.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
# Content-addressed naming for standalone playlist cover files.
sha2 = "0.10"
# Verifies developer-issued Pro activation codes (Ed25519-signed JWTs).
ed25519-dalek = "2"
# Cryptographically secure random bytes for the install identifier.
getrandom = "0.2"
# Enumerate installed font families for the lyrics font picker (loads the
# platform font directories and parses each font's name table).
fontdb = "0.24.0"
# SemVer comparison for update checks and the cumulative changelog range.
semver = "1"

# Password storage uses the platform-native keychain. Each backend is enabled
# only for its own target so we never compile another OS's dependencies.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Linux runs on the Chromium Embedded Framework instead of the system
# WebKitGTK webview, so the app no longer links webkit2gtk at all. The CEF
# binary distribution is downloaded by the `cef` crate on the first build and
# bundled next to the app by the Tauri CLI.
tauri-runtime-cef = { version = "3.0.0-alpha.6", features = ["devtools"] }
# rfd's GTK backend pumps the default GLib main context on its own thread, which
# aborts the CEF browser process after the dialog closes. The XDG portal backend
# runs out of process over D-Bus instead.
tauri-plugin-dialog = { version = "3.0.0-alpha.4", default-features = false, features = ["xdg-portal"] }
# The desktop-lyric overlay is a CEF off-screen browser: the runtime hands over
# the painted BGRA frame and we composite it into the GTK4 window ourselves (see
# `src/platform/linux/desktop_lyric.rs`). `Cef::on_window_event` speaks in this
# crate's winit types, and the compositing uses GTK4's texture/snapshot API.
winit = { version = "0.31.0-beta.3", package = "tauri-winit", default-features = false }
gtk = { version = "0.11.5", package = "gtk4" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-runtime-wry = { version = "3.0.0-alpha.5", features = ["devtools"] }
tauri-plugin-dialog = "3.0.0-alpha.4"

# System media controls on desktop: Windows SMTC, macOS Now Playing and Linux
# MPRIS behind one API. Android implements its own native MediaSession, so the
# crate is only pulled in for the three desktop targets.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
souvlaki = "0.8"
# Signed, per-platform updates published as GitHub release assets. Desktop only:
# Android queries the GitHub Releases API and downloads the APK manually instead.
tauri-plugin-updater = "3.0.0-alpha.3"

# Audio decoding/rendering is shared by the desktop and Android targets: `cpal`
# drives WASAPI / CoreAudio / ALSA on desktop and Oboe (AAudio / OpenSL ES) on
# Android, so there is no hand-written JNI. `symphonia-all` covers
# mp3/flac/vorbis/wav/aac/mp4; `symphonia-alac` adds ALAC. `cpal-shared-stdcxx`
# links the NDK's shared libc++ that the Tauri Android app already ships.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "android"))'.dependencies]
# rodio 0.21 owns the decode path again: `Decoder::builder().with_byte_len(len)`
# reports the real stream length to Symphonia, which is what its demuxers need to
# seek (rodio 0.20 hardcoded `byte_len() == None`, so every FLAC seek fell back to
# re-decoding from sample 0). The `flac`/`mp3`/`mp4`/`vorbis`/`wav` meta-features
# pull the matching Symphonia demuxer+codec pairs; `symphonia-alac` adds ALAC.
# `playback` enables the cpal output stream.
rodio = { version = "0.21", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-alac", "symphonia-adpcm", "cpal-shared-stdcxx"] }
# Pitch-preserving playback-speed changes (WSOLA time-stretch). Pure Rust, so
# it cross-compiles to Android with no extra C/C++ toolchain.
wsola = "0.2"
rustfft = "6"
# Lock-free single-producer/single-consumer audio transport. The producer
# stays on the decode worker and the consumer is owned by RingSource.
rtrb = "0.3"

# Android has no keyring backend of its own. `android-keyring` installs a
# Keystore-backed credential builder over the plain `keyring` crate.
# `jni`/`ndk-context` are used to publish the Android context that
# android-keyring (via ndk-context) expects, which tao 0.35 no longer does.
[target.'cfg(target_os = "android")'.dependencies]
keyring = "3"
android-keyring = "0.2"
jni = "0.21"
ndk-context = "0.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The WSOLA time-stretcher runs a per-sample similarity search (~hundreds of
# millions of multiply-adds per second) on the decode worker. At the dev
# profile's `opt-level = 0` it cannot keep up with realtime playback, so build
# just this dependency optimized even in `cargo run` / `tauri dev`.
[profile.dev.package.wsola]
opt-level = 3
