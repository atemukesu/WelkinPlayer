<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Welkin Player</title>
    <script>
      // Captured before the splash markup paints so the app can enforce a
      // minimum display time and avoid a one-frame flash on fast boots.
      window.__welkinSplashStart = Date.now();
      (function () {
        try {
          var theme = localStorage.getItem("welkin-theme");
          var accent = localStorage.getItem("welkin-accent") || "amber";
          var locale = localStorage.getItem("welkin-locale") || "zh-CN";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.dataset.accent = accent;
          document.documentElement.lang = locale;
        } catch (error) {
          document.documentElement.dataset.accent = "amber";
        }
      })();
      // Safety net: never leave the splash overlay stuck on screen if the app
      // fails to boot (e.g. the bundle throws before it can dismiss it).
      window.setTimeout(function () {
        var splash = document.getElementById("splash");
        if (splash) splash.remove();
      }, 20000);
    </script>
    <style>
      /* Inline splash styling. Duplicates the theme tokens from src/style.css
         because that stylesheet only loads with the JS bundle. */
      #splash {
        --splash-bg: #e6e6e2;
        --splash-fg: #101216;
        --splash-muted: #545a63;
        --splash-line: rgba(0, 0, 0, 0.14);
        --splash-accent: #f0a500;
        --splash-accent-fg: #101216;
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--splash-bg);
        color: var(--splash-fg);
        font-family: "Noto Sans SC Variable", "Inter", "Segoe UI", "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 420ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 420ms linear;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #splash.splash-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      html.dark #splash {
        --splash-bg: #0b0c0f;
        --splash-fg: #f3f4f6;
        --splash-muted: #9aa1ab;
        --splash-line: rgba(255, 255, 255, 0.14);
      }
      html[data-accent="orange"] #splash { --splash-accent: #ff6a00; --splash-accent-fg: #ffffff; }
      html[data-accent="cyan"] #splash { --splash-accent: #00b8d4; --splash-accent-fg: #101216; }
      html[data-accent="red"] #splash { --splash-accent: #e63946; --splash-accent-fg: #ffffff; }
      html[data-accent="green"] #splash { --splash-accent: #16c79a; --splash-accent-fg: #101216; }
      html[data-accent="blue"] #splash { --splash-accent: #3d7dff; --splash-accent-fg: #ffffff; }
      #splash .splash-mark {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        background: var(--splash-accent);
        color: var(--splash-accent-fg);
      }
      #splash .splash-mark svg { width: 26px; height: 26px; }
      /* --- Pro edition splash: a soft accent glow that eases in ------------- */
      #splash::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: radial-gradient(circle at 50% 44%, color-mix(in srgb, var(--splash-accent) 26%, transparent), transparent 62%);
        opacity: 0;
        transition: opacity 760ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      html.is-pro #splash::before { opacity: 1; }
      /* Glowing mark. */
      html.is-pro #splash .splash-mark {
        position: relative;
        isolation: isolate;
        animation: splash-pro-glow 2.4s ease-in-out infinite;
      }
      html.is-pro #splash .splash-mark svg { position: relative; z-index: 1; }
      html.is-pro #splash .splash-edition { color: var(--splash-accent); }

      @keyframes splash-pro-glow {
        0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--splash-accent) 55%, transparent); }
        50% { box-shadow: 0 0 24px 3px color-mix(in srgb, var(--splash-accent) 70%, transparent); }
      }
      #splash .splash-name {
        margin: 0;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        line-height: 1;
      }
      #splash .splash-edition {
        margin: -8px 0 0;
        min-height: 11px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        line-height: 1;
        color: var(--splash-muted);
        opacity: 0;
        transform: translateY(3px);
        transition: opacity 520ms cubic-bezier(0.2, 0.8, 0.2, 1), transform 520ms cubic-bezier(0.2, 0.8, 0.2, 1), color 760ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      /* Fades the edition line in once Rust has answered, instead of popping. */
      html.edition-ready #splash .splash-edition { opacity: 1; transform: none; }
      #splash .splash-track {
        position: relative;
        width: 148px;
        height: 3px;
        overflow: hidden;
        background: var(--splash-line);
      }
      #splash .splash-track span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        background: var(--splash-accent);
        animation: splash-slide 1.1s cubic-bezier(0.6, 0, 0.4, 1) infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-track span { animation: none; width: 100%; opacity: 0.6; }
        #splash::before { transition: none; }
        #splash .splash-edition { transition: none; opacity: 1; transform: none; }
        html.is-pro #splash .splash-mark { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="18" r="4" /><path d="M12 18V2l7 4" /></svg>
      </div>
      <p class="splash-name">Welkin</p>
      <p class="splash-edition"></p>
      <div class="splash-track"><span></span></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
